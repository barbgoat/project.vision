[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]  # do pypylon (SWIG)

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]  # erros reais (pyflakes) e o estilo básico; python -m ruff check .
ignore = ["E501", "E741"]  # linhas um pouco acima de 120 e a variável "l" (largura) são aceites
